<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PGDCA Semester 2 Quiz Platform" />
  <title>PGDCA Semester 2 Quiz</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body style="padding-top: 5rem;">
  <nav class="top-nav">
    <div style="display: flex; align-items: center; gap: 1.5rem;">
      <a href="./" class="nav-brand">PGDCA Quiz</a>
      <a href="./leaderboard.html" style="color: #fbbf24; text-decoration: none; font-weight: 600;">🏆 Leaderboard</a>
    </div>
    <div class="nav-links">
       <button class="nav-subject-btn" data-subject="SAD">SAD</button>
       <button class="nav-subject-btn" data-subject="DSA">DSA</button>
       <button class="nav-subject-btn" data-subject="C++">C++</button>
       <button class="nav-subject-btn" data-subject="DBMS">DBMS</button>
       <button class="nav-subject-btn" data-subject="NM">Math & Stat</button>
    </div>
  </nav>
  <div class="blob-bg"></div>
  <div class="container main-container glass-panel pulse-enter">
    <header class="hero">
      <h1>PGDCA Semester 2</h1>
      <p>Test your knowledge and view your rankings.</p>
    </header>
    
    <main class="login-form">
      <div class="input-group">
        <label for="studentName">Your Full Name</label>
        <input type="text" id="studentName" placeholder="e.g. John Doe" autocomplete="off" />
      </div>
      
      <div class="input-group">
        <label>Select Subject</label>
        <div class="subject-grid">
          <button class="subject-card" data-subject="SAD">System Analysis and Design</button>
          <button class="subject-card" data-subject="DSA">Data Structures & Algo</button>
          <button class="subject-card" data-subject="C++">C++ Programming</button>
          <button class="subject-card" data-subject="DBMS">DBMS</button>
          <button class="subject-card" data-subject="NM">Numerical Method & Statistics</button>
        </div>
      </div>
    </main>

    <footer class="footer-links">
      <a href="./leaderboard.html" class="nav-link">🏆 View Leaderboard</a>
      <a href="./admin.html" class="nav-link">Upload Quiz</a>
    </footer>
  </div>
  
  <script type="module" src="/src/app.js"></script>
  <script type="module" src="/src/nav.js"></script>
</body>
</html>
