<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGDCA-IT 2nd Semester quiz</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body style="padding-top: 5rem;">
  <nav class="top-nav">
    <div style="display: flex; align-items: center; gap: 1.5rem;">
      <a href="./" class="nav-brand">PGDCA-IT 2<sup>nd</sup> Semester quiz</a>
    </div>
    <div class="nav-links">
       <button class="nav-subject-btn" data-subject="SAD">SAD</button>
       <button class="nav-subject-btn" data-subject="DSA">DSA</button>
       <button class="nav-subject-btn" data-subject="C++">C++</button>
       <button class="nav-subject-btn" data-subject="DBMS">DBMS</button>
       <button class="nav-subject-btn" data-subject="NM">Math & Stat</button>
    </div>
  </nav>
  <div class="container main-container panel pulse-enter">
    <div class="quiz-header">
      <span id="subjectDisplay">Subject: ...</span>
    </div>

    <!-- Motivational line injected here -->
    <div id="motivationalLine" style="text-align: center; margin-bottom: 1rem; color: #fbbf24; font-style: italic; font-weight: 600; font-size: 1.1rem; min-height: 1.5rem; animation: fadeIn 0.5s;"></div>

    <div id="liveScoreTracker" style="text-align: center; margin-bottom: 1.5rem; font-weight: 600; font-size: 1.2rem; background: rgba(0,0,0,0.2); padding: 0.75rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: none;">
      <span style="color: #34d399;">Correct: <span id="correctPts">0</span></span>
      <span style="margin: 0 1rem; color: #64748b;">|</span>
      <span style="color: #f87171;">Wrong: <span id="wrongPts">0</span></span>
    </div>
    
    <div id="quizContent" style="display: none;">
      <div id="questionContainer" class="question-container">
        <!-- Questions injected here -->
      </div>
    </div>

    <div id="loading" style="text-align: center;">Loading questions...</div>
    <div id="noQuestions" class="status error" style="display: none; margin-top:2rem; text-align: center;">No questions available for this subject yet. Please ask your administrator to upload the questions via the Admin Dashboard.</div>

    <footer class="footer-links">
      <a href="./chat.html" class="chat-btn">Let's Chat Here</a>
      <div class="copyright-section">
        &copy; 2026 Made by Anvaya. All rights reserved.
      </div>
    </footer>
  </div>
  <script type="module" src="/src/quiz.js"></script>
  <script type="module" src="/src/nav.js"></script>
</body>
</html>
