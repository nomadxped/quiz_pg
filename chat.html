<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGDCA-IT 2nd Semester quiz - Chat</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 60vh;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      animation: fadeIn 0.3s;
    }
    .message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .message-author {
      font-weight: 600;
      color: #fbbf24;
    }
    .message-text {
      font-size: 1rem;
      color: white;
      word-break: break-word;
    }
    .chat-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .chat-input {
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      font-family: inherit;
    }
    .chat-input:focus {
      outline: none;
      border-color: #34d399;
    }
    .send-btn {
      padding: 0.75rem;
      background: #34d399;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .send-btn:hover {
      background: #10b981;
    }
    .send-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body style="padding-top: 5rem;">
  <nav class="top-nav">
    <div style="display: flex; align-items: center; gap: 1.5rem;">
      <a href="./" class="nav-brand">PGDCA-IT 2<sup>nd</sup> Semester quiz</a>
    </div>
  </nav>
  <div class="blob-bg"></div>
  <div class="container main-container glass-panel pulse-enter">
    <header class="hero">
      <h2>Public Discussion</h2>
      <p>Chat with classmates and help each other out.</p>
    </header>

    <main>
      <div class="chat-container">
        <div class="messages-area" id="messagesArea">
          <div style="text-align: center; color: #94a3b8; margin-top: 2rem;">Loading messages...</div>
        </div>
        <form class="chat-form" id="chatForm">
          <input type="text" id="chatName" class="chat-input" placeholder="Your Name" required maxlength="50" autocomplete="off" />
          <input type="text" id="chatMessage" class="chat-input" placeholder="Type a message..." required maxlength="500" autocomplete="off" />
          <button type="submit" class="send-btn" id="sendBtn">Send Message</button>
        </form>
      </div>
    </main>

    <footer class="footer-links">
      <span style="color: #cbd5e1; margin-right: 15px;">Made by Anvaya</span>
      <a href="./" class="nav-link">Back to Quiz</a>
    </footer>
  </div>

  <script type="module" src="/src/chat.js"></script>
</body>
</html>
